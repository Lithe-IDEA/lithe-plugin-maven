name: Release

# Push a tag v<version> matching plugin.json to publish a GitHub Release.
# Lithe Store's tracker picks up stable releases and opens index pull requests.
# Tags listed in PRERELEASE_TAGS below are published as pre-releases, which the
# tracker skips; they need a manually submitted Store entry. Keep the plain
# v<version> tag. docs/releases/<tag>.md, when present, lists the changes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      # --expect-tag requires the tag to match plugin.json and the extension POM version.
      - name: Build the archive
        run: |
          set -o pipefail
          node scripts/package.mjs --expect-tag "$GITHUB_REF_NAME" | tee "$RUNNER_TEMP/checksums.txt"
      - name: Run the declared commands with Maven on Java 8
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: node scripts/test.mjs
      - name: Verify Linux and Windows release archives
        run: node --test --test-timeout=60000 scripts/package/*.test.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # v0.0.1 follows plugin contract v0, which only the new desktop
          # client installs, and that client ships as desktop-v* pre-releases.
          # v0.2.1 is published as a stable release so the Store tracker lists it.
          PRERELEASE_TAGS: v0.0.1 v0.2.0
        run: |
          prerelease=false
          for tag in $PRERELEASE_TAGS; do
            if [[ "$tag" == "$GITHUB_REF_NAME" ]]; then prerelease=true; fi
          done
          # docs/releases/<tag>.md carries the release's own compatibility
          # section. Without it, the requirements come from plugin.json, so the
          # note never names a host requirement the package does not declare.
          {
            if [[ -s "docs/releases/$GITHUB_REF_NAME.md" ]]; then
              cat "docs/releases/$GITHUB_REF_NAME.md"
              echo
            else
              # shellcheck disable=SC2016 # the template literal is JavaScript
              node -e '
                const m = require("./io.github.lithe-idea.maven-build/plugin.json");
                const needs = Object.entries(m.requires || {}).map(([k, v]) => `${k} ${v}`).join("、");
                console.log(`兼容性：按插件契约 v${m.schemaVersion}（pluginAPIVersion ${m.pluginAPIVersion}）编写，需要支持 ${needs} 的 Lithe 桌面端。请先升级宿主；旧版宿主继续使用原有兼容插件版本。`);
              '
              echo
            fi
            if [[ "$prerelease" == true ]]; then
              echo "安装：预发布版本，Lithe Store 自动追踪会跳过，暂不收录 Store。下载下面的 ZIP，在 设置 → 插件 中点击页面标题栏右侧的 从文件安装…，选中 ZIP 后核对 SHA-256 并确认。"
            else
              echo "安装：Lithe Store（https://github.com/Lithe-IDEA/Lithe-store）中的 Maven 条目合并后，可在 设置 → 插件 → 插件市场 中搜索 Maven 并安装。"
            fi
            echo
            echo "SHA-256："
            echo '```'
            sed 's#^dist/##' "$RUNNER_TEMP/checksums.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          release_flags=()
          if [[ "$prerelease" == true ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "Maven $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${release_flags[@]}"
