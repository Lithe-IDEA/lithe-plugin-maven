name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The runner's Maven, and the oldest version plugin.json accepts.
        maven: [runner, 3.6.3]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 17 builds the extension and runs the latest Maven (the last version
      # is the default); the oldest Maven runs the extension on Java 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Check script process deadlines and cleanup
        run: node scripts/test-process.mjs
      - name: Check manifest and build the archive
        run: node scripts/package.mjs
      - name: Download Maven ${{ matrix.maven }}
        if: matrix.maven != 'runner'
        env:
          VERSION: ${{ matrix.maven }}
        run: |
          base="https://archive.apache.org/dist/maven/maven-3/$VERSION/binaries/apache-maven-$VERSION-bin.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/maven.tar.gz" "$base"
          echo "$(curl -fsSL "$base.sha512" | cut -d' ' -f1)  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "MVN=$RUNNER_TEMP/apache-maven-$VERSION/bin/mvn" >> "$GITHUB_ENV"
      - name: Run the declared commands with Maven
        env:
          # The oldest Maven also runs on the oldest Java.
          JAVA_HOME: ${{ matrix.maven == 'runner' && env.JAVA_HOME || env[format('JAVA_HOME_8_{0}', runner.arch)] }}
        run: node scripts/test.mjs
      - name: Verify native compiler targets and local JARs
        if: matrix.maven == 'runner'
        run: |
          node --test --test-timeout=15000 scripts/compiler/process.test.mjs
          node scripts/compiler/test.mjs
      - name: Upload native compiler projections
        if: matrix.os == 'ubuntu-latest' && matrix.maven == 'runner'
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-projection
          path: .artifacts/compiler/visual-*.json
          if-no-files-found: error
      - name: Verify Linux and Windows release archives
        run: node --test --test-timeout=60000 scripts/package/*.test.mjs
      - name: Hand the Windows archive to the Windows job
        if: matrix.maven == 'runner' && runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-windows
          path: dist/maven-build-*-windows.zip
          if-no-files-found: error
      - name: Validate against Lithe Store rules
        if: matrix.maven == 'runner'
        run: |
          git clone --depth 1 https://github.com/Lithe-IDEA/Lithe-store "$RUNNER_TEMP/store"
          node --input-type=module -e "
            import { readPackageManifests, checkManifest } from '$RUNNER_TEMP/store/scripts/validate-index.mjs';
            import { readdirSync, readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('io.github.lithe-idea.maven-build/plugin.json', 'utf8'));
            const entry = { id: manifest.id };
            let failed = false;
            for (const name of readdirSync('dist').filter((name) => name.endsWith('.zip'))) {
              const { manifests, unsafe } = readPackageManifests('dist/' + name, entry.id);
              const problems = [...unsafe, ...checkManifest(manifests, entry, manifest)];
              for (const problem of problems) { console.error(name + ': ' + problem); failed = true; }
            }
            process.exit(failed ? 1 : 0);
          "
      - name: Upload script timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-timings-maven-${{ matrix.maven }}-${{ runner.arch }}
          path: .artifacts/test-stability/
          if-no-files-found: warn

  native-settings-visual:
    name: Native compiler settings screenshots
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-compiler-projection
          path: .artifacts/compiler
      - name: Read pinned host revision
        id: host
        run: echo "revision=$(node -p 'JSON.parse(require("fs").readFileSync("compiler-host.json")).revision')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: 1lck/Lithe-IDEA
          ref: ${{ steps.host.outputs.revision }}
          path: .artifacts/host
      - uses: actions/setup-go@v5
        with:
          go-version-file: .artifacts/host/desktop/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render actual compiler projections through the native host
        run: node scripts/compiler/visual.mjs .artifacts/host
      - uses: actions/upload-artifact@v4
        with:
          name: native-compiler-settings-screenshots
          path: .artifacts/compiler/visual/
          if-no-files-found: error
          retention-days: 14

  # The Windows archive built above, unpacked the way Lithe installs it (under
  # a path with a space), runs the declared commands through mvn.cmd.
  windows:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        maven: [runner, 3.6.3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: actions/download-artifact@v4
        with:
          name: maven-build-windows
          path: ${{ runner.temp }}/archive
      - name: Unpack the Windows archive
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP\archive\maven-build-*-windows.zip" | Select-Object -First 1
          $plugins = Join-Path $env:RUNNER_TEMP "Lithe Plugins"
          Expand-Archive -Path $archive.FullName -DestinationPath $plugins
          "LITHE_TEST_PLUGIN_DIR=$plugins\io.github.lithe-idea.maven-build" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download Maven ${{ matrix.maven }}
        if: matrix.maven != 'runner'
        env:
          VERSION: ${{ matrix.maven }}
        run: |
          $base = "https://archive.apache.org/dist/maven/maven-3/$env:VERSION/binaries/apache-maven-$env:VERSION-bin.zip"
          $zip = Join-Path $env:RUNNER_TEMP "maven.zip"
          Invoke-WebRequest $base -OutFile $zip
          Invoke-WebRequest "$base.sha512" -OutFile "$zip.sha512"
          $expected = ((Get-Content -Raw "$zip.sha512").Trim() -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA512).Hash
          if ($actual -ne $expected) { throw "SHA-512 mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          "MVN=$env:RUNNER_TEMP\apache-maven-$env:VERSION\bin\mvn.cmd" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the declared commands with Maven on Windows
        env:
          JAVA_HOME: ${{ matrix.maven == 'runner' && env.JAVA_HOME || env[format('JAVA_HOME_8_{0}', runner.arch)] }}
        run: |
          if ($env:MVN) { & $env:MVN --version } else { mvn --version }
          node scripts/test.mjs
      - name: Verify native compiler settings and JARs in the installed Windows archive
        if: matrix.maven == 'runner'
        run: |
          node --test --test-timeout=15000 scripts/compiler/process.test.mjs
          node scripts/compiler/test.mjs
      - name: Upload script timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-timings-maven-${{ matrix.maven }}-windows-${{ runner.arch }}
          path: .artifacts/test-stability/
          if-no-files-found: warn
