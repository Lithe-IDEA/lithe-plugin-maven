name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sdk-revision:
        description: 'Exact lithe-plugin-docs commit for development-only Java 8 validation'
        required: true
        type: string
      core-revision:
        description: 'Optional exact Lithe commit for current native configuration and Core workflows'
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The runner's Maven, and the oldest version plugin.json accepts.
        maven: [runner, 3.6.3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 17 builds and runs Maven (the last version is the default); the
      # build provider is also tested on 8, the oldest plugin.json accepts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Check script process deadlines and cleanup
        run: node scripts/test-process.mjs
      - name: Check manifest and build the archive
        run: node scripts/package.mjs
      - name: Test the build provider's snapshot with a fake Maven (Java 17)
        run: node scripts/test-backend.mjs
      - name: Test the build provider's snapshot with a fake Maven (Java 8)
        env:
          LITHE_TEST_JAVA: ${{ env.JAVA_HOME_8_X64 }}/bin/java
        run: node scripts/test-backend.mjs
      - name: Test native Provider execution and cleanup (Java 17)
        env:
          LITHE_REPORT_DIR: .artifacts/test-stability/native-java17
        run: node scripts/test-native.mjs
      - name: Test native Provider execution and cleanup (Java 8)
        env:
          LITHE_TEST_JAVA: ${{ env.JAVA_HOME_8_X64 }}/bin/java
          LITHE_REPORT_DIR: .artifacts/test-stability/native-java8
        run: node scripts/test-native.mjs
      - name: Download Maven ${{ matrix.maven }}
        if: matrix.maven != 'runner'
        env:
          VERSION: ${{ matrix.maven }}
        run: |
          base="https://archive.apache.org/dist/maven/maven-3/$VERSION/binaries/apache-maven-$VERSION-bin.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/maven.tar.gz" "$base"
          echo "$(curl -fsSL "$base.sha512" | cut -d' ' -f1)  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "MVN=$RUNNER_TEMP/apache-maven-$VERSION/bin/mvn" >> "$GITHUB_ENV"
      - name: Run the provider and the declared commands with Maven
        env:
          # The oldest Maven also gets the oldest Java for the provider.
          LITHE_TEST_JAVA: ${{ matrix.maven == 'runner' && 'java' || format('{0}/bin/java', env.JAVA_HOME_8_X64) }}
        run: node scripts/test.mjs
      - name: Validate against Lithe Store rules
        if: matrix.maven == 'runner'
        run: |
          git clone --depth 1 https://github.com/Lithe-IDEA/Lithe-store "$RUNNER_TEMP/store"
          node --input-type=module -e "
            import { readPackageManifests, checkManifest } from '$RUNNER_TEMP/store/scripts/validate-index.mjs';
            import { readdirSync, readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('io.github.lithe-idea.maven-build/plugin.json', 'utf8'));
            const entry = { id: manifest.id };
            let failed = false;
            for (const name of readdirSync('dist').filter((name) => name.endsWith('.zip'))) {
              const { manifests, unsafe } = readPackageManifests('dist/' + name, entry.id);
              const problems = [...unsafe, ...checkManifest(manifests, entry, manifest)];
              for (const problem of problems) { console.error(name + ': ' + problem); failed = true; }
            }
            process.exit(failed ? 1 : 0);
          "
      - name: Upload script timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-timings-maven-${{ matrix.maven }}
          path: .artifacts/test-stability/
          if-no-files-found: warn

  development-sdk:
    name: Development SDK / Maven ${{ matrix.maven }} / Java 8
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        maven: [runner, 3.6.3]
    steps:
      - uses: actions/checkout@v4
      - name: Require a fixed SDK source revision
        env:
          SDK_REVISION: ${{ inputs.sdk-revision }}
        run: '[[ "$SDK_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: Lithe-IDEA/lithe-plugin-docs
          ref: ${{ inputs.sdk-revision }}
          path: .artifacts/sdk-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Build the explicit development SDK and isolated plugin package
        run: |
          mvn -B -ntp -q -f .artifacts/sdk-source/sdk/java/pom.xml -DskipTests package
          node scripts/package-development.mjs --sdk-jar "$GITHUB_WORKSPACE/.artifacts/sdk-source/sdk/java/plugin-sdk/target/lithe-plugin-sdk-java-0.1.0.jar"
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const p=JSON.parse(readFileSync(".artifacts/native-development/latest.json")); if(p.developmentOnly!==true) throw Error("Expected a development package"); appendFileSync(process.env.GITHUB_ENV, `LITHE_TEST_PACKAGE=${p.package}\n`);'
      - name: Check process cleanup
        run: node scripts/test-process.mjs
      - name: Test snapshot and native execution on Java 8
        env:
          LITHE_TEST_JAVA: ${{ env.JAVA_HOME_8_X64 }}/bin/java
        run: |
          node scripts/test-backend.mjs
          node scripts/test-native.mjs
      - name: Download Maven ${{ matrix.maven }}
        if: matrix.maven != 'runner'
        env:
          VERSION: ${{ matrix.maven }}
        run: |
          base="https://archive.apache.org/dist/maven/maven-3/$VERSION/binaries/apache-maven-$VERSION-bin.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/maven.tar.gz" "$base"
          echo "$(curl -fsSL "$base.sha512" | cut -d' ' -f1)  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "MVN=$RUNNER_TEMP/apache-maven-$VERSION/bin/mvn" >> "$GITHUB_ENV"
      - name: Run the real Maven reactor through the Java 8 Provider
        env:
          LITHE_TEST_JAVA: ${{ env.JAVA_HOME_8_X64 }}/bin/java
        run: node scripts/test.mjs
      - name: Require a fixed Core revision when selected
        if: inputs.core-revision != ''
        env:
          CORE_REVISION: ${{ inputs.core-revision }}
        run: '[[ "$CORE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        if: inputs.core-revision != ''
        with:
          repository: 1lck/Lithe-IDEA
          ref: ${{ inputs.core-revision }}
          path: .artifacts/core-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.core-revision != ''
      - name: Build the selected host Core and verify real native settings
        if: inputs.core-revision != ''
        env:
          LITHE_TEST_JAVA: ${{ env.JAVA_HOME_8_X64 }}/bin/java
        run: |
          cargo build --locked --manifest-path .artifacts/core-source/rust/Cargo.toml -p lithe-core --lib
          export LITHE_CORE_LIBRARY="$GITHUB_WORKSPACE/.artifacts/core-source/rust/target/debug/liblithe_core.so"
          export LITHE_TEST_MAVEN="${MVN:-$(command -v mvn)}"
          node scripts/test-configuration.mjs
          node scripts/test-native-core.mjs
      - name: Prove the release inputs stayed unchanged
        run: |
          git diff --exit-code -- sdk.lock.json backend/pom.xml extension/pom.xml io.github.lithe-idea.maven-build
          test ! -e dist
      - name: Upload development timing and identity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-sdk-maven-${{ matrix.maven }}
          path: |
            .artifacts/test-stability/
            .artifacts/native-development/latest.json
            .artifacts/native-development/run-*/identity.json
          if-no-files-found: warn
